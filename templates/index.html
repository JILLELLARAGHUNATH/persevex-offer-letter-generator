<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Persevex Offer Letter Generator
    </title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>

<div class="app">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header>

        <div>

            <div class="brand">
                persevex
            </div>

            <div class="tagline">
                LEARN, GROW, SUCCEED
            </div>

        </div>

        <h1>
            OFFER LETTER GENERATOR
        </h1>

    </header>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main>


        <!-- =================================================
             LEFT FORM
             ================================================= -->

        <section class="card">


            <h2>
                Select Letter Type
            </h2>


            <div class="type-buttons">

                <button
                    type="button"
                    class="type-btn active"
                    data-type="with_hours"
                >
                    1. With Hours
                </button>


                <button
                    type="button"
                    class="type-btn"
                    data-type="without_hours"
                >
                    2. Without Hours
                </button>

            </div>


            <form
                id="letterForm"
                autocomplete="off"
            >


                <input
                    type="hidden"
                    id="letter_type"
                    value="with_hours"
                >


                <!-- =================================================
                     STUDENT NAME
                     ================================================= -->

                <label for="student_name">
                    Student Name
                </label>

                <input
                    id="student_name"
                    type="text"
                    required
                    placeholder="e.g. Snehil Das"
                    autocomplete="off"
                    spellcheck="false"
                >


                <!-- =================================================
                     STUDENT EMAIL
                     ================================================= -->

                <label for="student_email">
                    Student Email
                </label>

                <input
                    id="student_email"
                    type="email"
                    required
                    placeholder="student@example.com"
                    autocomplete="off"
                    spellcheck="false"
                >


                <!-- =================================================
                     DOMAIN
                     ================================================= -->

                <label for="domain">
                    Domain
                </label>

                <input
                    id="domain"
                    type="text"
                    required
                    placeholder="e.g. Data Analytics"
                    autocomplete="off"
                    spellcheck="false"
                >


                <!-- =================================================
                     DURATION DROPDOWN
                     ================================================= -->

                <label for="duration">
                    Months of Duration
                </label>

                <select
                    id="duration"
                    required
                >

                    <option value="2 months">
                        2 months
                    </option>

                    <option value="3 months">
                        3 months
                    </option>

                    <option value="4 months">
                        4 months
                    </option>

                    <option value="5 months">
                        5 months
                    </option>

                    <option value="6 months">
                        6 months
                    </option>

                </select>


                <!-- =================================================
                     DATES
                     ================================================= -->

                <div class="two">


                    <div>

                        <label for="start_date">
                            Start Date
                        </label>

                        <input
                            id="start_date"
                            type="date"
                            required
                        >

                    </div>


                    <div>

                        <label for="end_date">
                            End Date
                        </label>

                        <input
                            id="end_date"
                            type="date"
                            required
                        >

                    </div>


                </div>


                <!-- =================================================
                     STIPEND
                     ================================================= -->

                <label for="stipend">

                    Stipend

                    <span
                        style="
                        font-weight:400;
                        opacity:.65;
                        "
                    >
                        (Optional)
                    </span>

                </label>


                <input
                    id="stipend"
                    type="text"
                    inputmode="numeric"
                    placeholder="e.g. 18000"
                    autocomplete="off"
                    spellcheck="false"
                >


                <!-- =================================================
                     HOURS
                     ================================================= -->

                <div
                    id="hoursSection"
                >

                    <h3>
                        Hours
                    </h3>


                    <div class="three">


                        <div>

                            <label for="weeks">
                                Weeks
                            </label>

                            <input
                                id="weeks"
                                type="text"
                                readonly
                            >

                        </div>


                        <div>

                            <label for="hours_per_week">
                                Hours / Week
                            </label>

                            <input
                                id="hours_per_week"
                                type="number"
                                min="1"
                                step="1"
                                placeholder="15"
                            >

                        </div>


                        <div>

                            <label for="total_hours">
                                Total Hours
                            </label>

                            <input
                                id="total_hours"
                                type="text"
                                readonly
                            >

                        </div>


                    </div>


                    <div
                        class="hours-note"
                    >
                        Weeks and total hours are calculated
                        automatically.
                    </div>


                </div>


                <!-- =================================================
                     GENERATE
                     ================================================= -->

                <button
                    class="generate"
                    type="submit"
                    id="generateBtn"
                >
                    Generate Letter
                </button>


            </form>


            <div
                id="message"
                aria-live="polite"
            ></div>


        </section>


        <!-- =================================================
             RIGHT PDF PREVIEW
             ================================================= -->

        <section
            class="card preview-card"
        >


            <div class="preview-head">

                <h2>
                    PDF Preview
                </h2>


                <button
                    id="editBtn"
                    class="secondary"
                    type="button"
                    disabled
                >
                    Edit
                </button>

            </div>


            <div
                class="preview-container"
            >


                <div
                    id="emptyPreview"
                    class="empty-preview"
                >

                    <div class="empty-icon">
                        PDF
                    </div>

                    <div class="empty-title">
                        No letter generated
                    </div>

                    <div class="empty-text">
                        Enter the student details and
                        click Generate Letter.
                    </div>

                </div>


                <iframe
                    id="pdfPreview"
                    title="Generated PDF Preview"
                    loading="lazy"
                    hidden
                ></iframe>


            </div>


            <div class="actions">


                <a
                    id="downloadBtn"
                    class="primary disabled"
                    aria-disabled="true"
                >
                    Download PDF
                </a>


                <button
                    id="sendBtn"
                    class="email"
                    type="button"
                    disabled
                >
                    Send to Student
                </button>


            </div>


        </section>


    </main>

</div>


<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script>


/* ==========================================================
   ELEMENTS
   ========================================================== */

const form =
    document.getElementById(
        "letterForm"
    );

const typeButtons =
    document.querySelectorAll(
        ".type-btn"
    );

const letterType =
    document.getElementById(
        "letter_type"
    );

const duration =
    document.getElementById(
        "duration"
    );

const hoursSection =
    document.getElementById(
        "hoursSection"
    );

const weeks =
    document.getElementById(
        "weeks"
    );

const hoursPerWeek =
    document.getElementById(
        "hours_per_week"
    );

const totalHours =
    document.getElementById(
        "total_hours"
    );

const preview =
    document.getElementById(
        "pdfPreview"
    );

const emptyPreview =
    document.getElementById(
        "emptyPreview"
    );

const downloadBtn =
    document.getElementById(
        "downloadBtn"
    );

const sendBtn =
    document.getElementById(
        "sendBtn"
    );

const editBtn =
    document.getElementById(
        "editBtn"
    );

const generateBtn =
    document.getElementById(
        "generateBtn"
    );

const message =
    document.getElementById(
        "message"
    );


/* ==========================================================
   STATE
   ========================================================== */

let currentFilename = "";

let generated = false;

let formChanged = false;


/* ==========================================================
   WEEKS
   ========================================================== */

function getWeeks() {

    const months =
        parseInt(
            duration.value
        );

    return months * 4;

}


/* ==========================================================
   UPDATE HOURS
   ========================================================== */

function updateHours() {

    if (
        letterType.value
        !==
        "with_hours"
    ) {

        return;

    }


    const calculatedWeeks =
        getWeeks();


    weeks.value =
        calculatedWeeks;


    const hours =
        parseInt(
            hoursPerWeek.value
        );


    if (
        Number.isFinite(hours)
        &&
        hours > 0
    ) {

        totalHours.value =
            calculatedWeeks
            *
            hours;

    }
    else {

        totalHours.value =
            "";

    }

}


/* ==========================================================
   DURATION
   ========================================================== */

duration.addEventListener(
    "change",
    function() {

        updateHours();

        markFormChanged();

    }
);


/* ==========================================================
   HOURS PER WEEK
   ========================================================== */

hoursPerWeek.addEventListener(
    "input",
    function() {

        updateHours();

        markFormChanged();

    }
);


/* ==========================================================
   LETTER TYPE
   ========================================================== */

function setType(type) {

    letterType.value =
        type;


    typeButtons.forEach(
        function(button) {

            button.classList.toggle(
                "active",
                button.dataset.type
                ===
                type
            );

        }
    );


    const withHours =
        type === "with_hours";


    hoursSection.style.display =
        withHours
            ? "block"
            : "none";


    hoursPerWeek.required =
        withHours;


    if (withHours) {

        updateHours();

    }


    markFormChanged();

}


/* ==========================================================
   TYPE BUTTONS
   ========================================================== */

typeButtons.forEach(
    function(button) {

        button.addEventListener(
            "click",
            function() {

                setType(
                    button.dataset.type
                );

            }
        );

    }
);


/* ==========================================================
   FORM CHANGED
   ========================================================== */

function markFormChanged() {

    if (!generated) {

        return;

    }


    if (formChanged) {

        return;

    }


    formChanged =
        true;


    /*
        Remove old PDF from browser memory
        immediately when editing.
    */

    preview.src =
        "about:blank";

    preview.hidden =
        true;

    emptyPreview.hidden =
        false;


    disableDownload();

    sendBtn.disabled =
        true;


    message.textContent =
        "Details changed. Generate the letter again.";

}


/* ==========================================================
   FORM INPUT
   ========================================================== */

form.addEventListener(
    "input",
    function() {

        markFormChanged();

    }
);


form.addEventListener(
    "change",
    function() {

        markFormChanged();

    }
);


/* ==========================================================
   COLLECT DATA
   ========================================================== */

function collectFormData() {

    return {

        letter_type:
            letterType.value,

        student_name:
            document
                .getElementById(
                    "student_name"
                )
                .value
                .trim(),

        student_email:
            document
                .getElementById(
                    "student_email"
                )
                .value
                .trim(),

        domain:
            document
                .getElementById(
                    "domain"
                )
                .value
                .trim(),

        duration:
            duration.value,

        start_date:
            document
                .getElementById(
                    "start_date"
                )
                .value,

        end_date:
            document
                .getElementById(
                    "end_date"
                )
                .value,

        stipend:
            document
                .getElementById(
                    "stipend"
                )
                .value
                .trim(),

        weeks:
            weeks.value,

        hours_per_week:
            hoursPerWeek.value,

        total_hours:
            totalHours.value

    };

}


/* ==========================================================
   DOWNLOAD
   ========================================================== */

function disableDownload() {

    downloadBtn.removeAttribute(
        "href"
    );

    downloadBtn.removeAttribute(
        "download"
    );

    downloadBtn.classList.add(
        "disabled"
    );

    downloadBtn.setAttribute(
        "aria-disabled",
        "true"
    );

}


function enableDownload(
    url,
    filename
) {

    downloadBtn.href =
        url;

    downloadBtn.download =
        filename;

    downloadBtn.classList.remove(
        "disabled"
    );

    downloadBtn.setAttribute(
        "aria-disabled",
        "false"
    );

}


/* ==========================================================
   GENERATE LETTER
   ========================================================== */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        if (!form.checkValidity()) {

            form.reportValidity();

            return;

        }


        updateHours();


        generateBtn.disabled =
            true;

        generateBtn.textContent =
            "Generating...";


        message.textContent =
            "Generating letter...";


        const data =
            collectFormData();


        try {

            const response =
                await fetch(
                    "/generate",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                data
                            )
                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.error
                    ||
                    "Generation failed."
                );

            }


            currentFilename =
                result.filename;


            generated =
                true;

            formChanged =
                false;


            /*
                Load PDF only after
                Generate is clicked.
            */

            emptyPreview.hidden =
                true;

            preview.hidden =
                false;


            preview.src =
                result.url
                +
                "?t="
                +
                Date.now();


            enableDownload(
                result.url,
                result.filename
            );


            sendBtn.disabled =
                false;

            editBtn.disabled =
                false;


            message.textContent =
                "Letter generated successfully.";


        }
        catch (error) {

            console.error(
                error
            );


            message.textContent =
                error.message
                ||
                "Generation failed.";


            sendBtn.disabled =
                true;

            disableDownload();

        }
        finally {

            generateBtn.disabled =
                false;

            generateBtn.textContent =
                "Generate Letter";

        }

    }
);


/* ==========================================================
   EDIT
   ========================================================== */

editBtn.addEventListener(
    "click",
    function() {

        preview.src =
            "about:blank";

        preview.hidden =
            true;

        emptyPreview.hidden =
            false;


        disableDownload();

        sendBtn.disabled =
            true;


        formChanged =
            true;


        message.textContent =
            "Edit the details and generate again.";


        document
            .getElementById(
                "student_name"
            )
            .focus();

    }
);


/* ==========================================================
   SEND EMAIL
   ========================================================== */

sendBtn.addEventListener(
    "click",
    async function() {

        if (!currentFilename) {

            message.textContent =
                "Generate the letter first.";

            return;

        }


        const studentEmail =
            document
                .getElementById(
                    "student_email"
                )
                .value
                .trim();


        const studentName =
            document
                .getElementById(
                    "student_name"
                )
                .value
                .trim();


        if (!studentEmail) {

            message.textContent =
                "Please enter the student's email.";

            return;

        }


        sendBtn.disabled =
            true;


        message.textContent =
            "Sending email...";


        try {

            const response =
                await fetch(
                    "/send-email",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                filename:
                                    currentFilename,

                                student_email:
                                    studentEmail,

                                student_name:
                                    studentName

                            })
                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.error
                    ||
                    "Email failed."
                );

            }


            message.textContent =
                "Email sent successfully.";

        }
        catch (error) {

            console.error(
                error
            );


            message.textContent =
                error.message
                ||
                "Email failed.";

        }
        finally {

            sendBtn.disabled =
                false;

        }

    }
);


/* ==========================================================
   INITIAL STATE
   ========================================================== */

setType(
    "with_hours"
);


preview.src =
    "about:blank";

preview.hidden =
    true;

emptyPreview.hidden =
    false;


disableDownload();

sendBtn.disabled =
    true;

editBtn.disabled =
    true;


generated =
    false;

formChanged =
    false;


updateHours();

</script>


</body>

</html>
