<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" type="image/png" href="/static/persevex-icon.png">
    <title>Persevex - Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.04) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.04) 0px, transparent 50%);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #0f172a;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 40px 36px;
            border-radius: 18px;
            box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.06), 0 20px 30px -10px rgba(15, 23, 42, 0.1), 0 0 0 1px rgba(226, 232, 240, 0.8);
            border: 1px solid #e2e8f0;
        }
        .brand-logo-wrapper {
            width: 52px;
            height: 52px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
        }
        .brand-logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .brand {
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .brand-llp {
            font-size: 11px;
            font-weight: 700;
            color: #2563eb;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }
        .tagline {
            text-align: center;
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #64748b;
            margin: 4px 0 22px;
            text-transform: uppercase;
        }
        h1 {
            text-align: center;
            font-size: 17px;
            font-weight: 700;
            color: #334155;
            margin: 0 0 22px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e2e8f0;
        }
        label {
            display: block;
            font-size: 12.5px;
            font-weight: 700;
            color: #334155;
            margin: 14px 0 6px;
        }
        input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            color: #0f172a;
            background: #ffffff;
            outline: none;
            transition: all 0.15s ease;
        }
        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: #0f172a;
            color: #ffffff;
            font-size: 14.5px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
            transition: all 0.15s ease;
        }
        button:hover {
            background: #1e293b;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.25);
        }
        button:active {
            transform: translateY(0);
        }
        .error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 16px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="brand-logo-wrapper">
        <img src="/static/persevex-icon.png" alt="Persevex">
    </div>
    <div class="brand">
        persevex <span class="brand-llp">LLP</span>
    </div>
    <div class="tagline">LEARN, GROW, SUCCEED</div>
    <h1>Sign in to Generator</h1>
    {% if error %}
        <div class="error">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            {{ error }}
        </div>
    {% endif %}
    <form method="post">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required autofocus placeholder="Enter your username">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter your password">
        <button type="submit">Sign In</button>
    </form>
</div>
</body>
</html>
