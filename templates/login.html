<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Persevex - Login</title>
    <style>
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f6f8;font-family:Arial,sans-serif}
        .login-card{width:min(420px,92vw);background:#fff;padding:36px;border-radius:14px;box-shadow:0 10px 35px rgba(0,0,0,.12)}
        .brand{text-align:center;font-size:30px;font-weight:700;letter-spacing:.5px}
        .tagline{text-align:center;font-size:11px;letter-spacing:2px;color:#777;margin:4px 0 28px}
        h1{text-align:center;font-size:22px;margin:0 0 24px}
        label{display:block;font-weight:600;margin:14px 0 7px}
        input{width:100%;padding:12px 13px;border:1px solid #d5d9de;border-radius:8px;font-size:15px}
        button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:8px;background:#111;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
        .error{background:#fff0f0;color:#b00020;border:1px solid #ffd0d0;border-radius:8px;padding:10px;margin-bottom:14px;font-size:14px}
    </style>
</head>
<body>
<div class="login-card">
    <div class="brand">persevex</div>
    <div class="tagline">LEARN, GROW, SUCCEED</div>
    <h1>Employee Login</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Login</button>
    </form>
</div>
</body>
</html>
