<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Campus Ambassador Offer Letter - Persevex</title>
    <link rel="icon" type="image/png" href="/static/persevex-icon.png">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app">

    <!-- =====================================================
         HEADER
         ===================================================== -->
    <header>
        <div class="brand-group">
            <div class="brand-icon-wrapper">
                <img src="/static/persevex-icon.png" alt="Persevex Logo" width="32" height="32">
            </div>
            <div class="brand-text-block">
                <div class="brand">
                    persevex <span class="brand-llp">LLP</span>
                </div>
                <div class="tagline">
                    LEARN, GROW, SUCCEED
                </div>
            </div>
        </div>

        <h1>
            CAMPUS AMBASSADOR <span class="highlight">OFFER LETTER</span>
        </h1>

        <!-- Navigation Tabs -->
        <nav class="nav-links-wrapper">
            <a href="/" class="nav-tab-link" title="Offer Letter Generator">
                <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
                <span>Offer Letter</span>
            </a>
            <a href="/campus-ambassador" class="nav-tab-link active" title="Campus Ambassador Offer Letter">
                <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span>CA Letter</span>
            </a>
            <a href="/certificate" class="nav-tab-link" title="Certificate Generator">
                <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="7"></circle>
                    <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
                </svg>
                <span>Certificate</span>
            </a>
            <a href="/ca-certificate" class="nav-tab-link" title="CA Certificate Generator"><svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"></path><path d="M3 12h18"></path></svg><span>CA Certificate</span></a>
            <a href="/history" class="nav-tab-link" title="Unified History">
                <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span>History</span>
            </a>
        </nav>

        <div class="header-stats" aria-label="Email delivery summary">
            <div class="header-stat success-stat" title="Total Successful Email Deliveries">
                <div class="stat-icon-wrapper">
                    <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <span>
                    Success:
                    <strong id="successCount">{{ success_count }}</strong>
                </span>
            </div>

            <div class="header-stat failed-stat" title="Total Failed Email Attempts">
                <div class="stat-icon-wrapper">
                    <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </div>
                <span>
                    Failed:
                    <strong id="failedCount">{{ failed_count }}</strong>
                </span>
            </div>
        </div>

        <div class="header-actions">
            <a href="/logout" class="logout-btn" title="Sign out of Persevex">
                <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Logout</span>
            </a>
        </div>
    </header>

    <!-- =====================================================
         MODE SWITCHER: SINGLE vs BULK CA OFFER LETTER
         ===================================================== -->
    <div class="mode-switcher-container">
        <div class="mode-switcher-pills">
            <a href="/campus-ambassador/single" id="tabSingleCA" class="mode-pill-btn active" style="text-decoration: none;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>Single CA Offer Letter</span>
            </a>
            <a href="/campus-ambassador/bulk" id="tabBulkCA" class="mode-pill-btn" style="text-decoration: none;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span>Bulk CA Offer Letters</span>
            </a>
        </div>
    </div>

</div>

</body>
</html>
